name: 港区全5地区の空き確認
on:
  workflow_dispatch:
    inputs:
      test_line:
        description: LINE接続テストのみ（空き確認なし）
        type: boolean
        default: false
      dry_run:
        description: 検索とテストのみ（LINE通知・履歴更新なし）
        type: boolean
        default: false
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
permissions:
  contents: write
concurrency:
  group: minato-facility-check
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.MINATO_AUTO_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: ZIP展開と整合性確認
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/minato-source"
          unzip -q minato-facility-check-actions.zip -d "$RUNNER_TEMP/minato-source"
          cd "$RUNNER_TEMP/minato-source"
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          manifest = Path('manifest.json')
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != 'e6ea3a3ffa7bf6b27bd62ba1e020f7594a6cc1ffbcf83db2ec49e72fe3af908f':
              raise SystemExit('MANIFEST_HASH_MISMATCH')
          for name, info in json.loads(manifest.read_text())['files'].items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != info['sha256']:
                  raise SystemExit('SOURCE_HASH_MISMATCH: '+name)
          PYCODE
      - name: オフラインテスト
        if: inputs.dry_run == true
        shell: bash
        run: |
          cd "$RUNNER_TEMP/minato-source"
          python3 tests/test_all_districts.py
          python3 tests/test_notifications.py
      - name: 施設の空き確認
        if: inputs.test_line != true || inputs.dry_run == true
        shell: bash
        run: |
          cd "$RUNNER_TEMP/minato-source"
          rc=0
          python3 run_all_districts.py --deadline 300 --output "$RUNNER_TEMP/minato-run" > "$RUNNER_TEMP/minato-result.json" || rc=$?
          python3 summarize_v5.py "$RUNNER_TEMP/minato-result.json" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::検索が一部または全部失敗しました。確認済みの枠のみ通知判定します。"
            if [ "${{ inputs.dry_run == true }}" = 'true' ]; then exit "$rc"; fi
          fi
      - name: LINE通知（新しい空きのみ）
        if: inputs.dry_run != true && github.ref == 'refs/heads/main'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TEST_LINE: ${{ inputs.test_line == true }}
        shell: bash
        run: python3 "$RUNNER_TEMP/minato-source/notify_v5.py"
      - name: 通知済みの枠を保存
        if: inputs.test_line != true && inputs.dry_run != true && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -f .minato-notified.json ]; then
            git add -- .minato-notified.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Update facility availability state'
              git push origin HEAD:main
            fi
          fi
