name: 品川区施設検索・初回診断
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shinagawa-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ブラウザ準備
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: 公開検索結果の診断（荏原地区のみ・予約なし）
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright

          URL = 'https://www.cm9.eprs.jp/shinagawa/web/index.jsp'
          out = Path('shinagawa-diagnostics')
          out.mkdir(exist_ok=True)
          SNAPSHOT = r'''() => {
            const clean = (s,n=200) => (s || '').replace(/\s+/g,' ').trim().slice(0,n);
            const visible = e => !!(e.offsetWidth || e.offsetHeight || e.getClientRects().length) && getComputedStyle(e).visibility !== 'hidden';
            return {
              title: document.title,
              text: clean(document.body?.innerText,7000),
              selects: [...document.querySelectorAll('select')].map(e=>({id:e.id,name:e.name,visible:visible(e),selected:e.selectedOptions[0]?.textContent,options:[...e.options].map(o=>({text:clean(o.textContent),value:o.value}))})),
              inputs: [...document.querySelectorAll('input:not([type=hidden])')].map(e=>({id:e.id,name:e.name,type:e.type,visible:visible(e),checked:e.checked,labels:[...(e.labels||[])].map(l=>clean(l.textContent))})),
              controls: [...document.querySelectorAll('a,button,[role=button],input[type=button],input[type=submit]')].filter(visible).slice(0,100).map(e=>({tag:e.tagName,id:e.id,text:clean(e.innerText||e.value||e.getAttribute('aria-label')),title:clean(e.title)})),
              tables: [...document.querySelectorAll('table')].filter(visible).slice(0,16).map(t=>({id:t.id,classes:t.className,row_count:t.rows.length,rows:[...t.rows].slice(0,12).map(r=>[...r.cells].slice(0,45).map(c=>({tag:c.tagName,text:clean(c.innerText,120),title:clean(c.title),classes:c.className,rowspan:c.rowSpan,colspan:c.colSpan,images:[...c.querySelectorAll('img')].slice(0,4).map(i=>({alt:clean(i.alt),title:clean(i.title),src:new URL(i.src,location.href).pathname.split('/').pop()})),labels:[...c.querySelectorAll('[aria-label]')].slice(0,4).map(e=>clean(e.getAttribute('aria-label')))})))}))
            };
          }'''
          def snapshot(page, label):
              report = []
              for frame in page.frames:
                  try:
                      report.append({'path':urlsplit(frame.url).path, **frame.evaluate(SNAPSHOT)})
                  except Exception as e:
                      report.append({'error':type(e).__name__})
              (out/(label+'.json')).write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
              # Keep public logs bounded; detailed table samples are in the artifact.
              compact = []
              for f in report:
                  compact.append({**{k:v for k,v in f.items() if k not in ('selects','tables')},'selects':[{k:v for k,v in s.items() if k!='options'} for s in f.get('selects',[])],'tables':[{**t,'rows':t['rows'][:4]} for t in f.get('tables',[])]})
              print('SHINAGAWA_RESULT_BEGIN',label,flush=True)
              print(json.dumps(compact,ensure_ascii=False),flush=True)
              print('SHINAGAWA_RESULT_END',label,flush=True)
              try:
                  page.screenshot(path=str(out/(label+'.png')),full_page=True,timeout=10000)
              except Exception as e:
                  print('SCREENSHOT_ERROR',type(e).__name__,flush=True)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(locale='ja-JP',timezone_id='Asia/Tokyo',viewport={'width':1440,'height':1000})
              responses=[]
              def observe(r):
                  if r.request.resource_type in ('document','xhr','fetch') and urlsplit(r.url).hostname == urlsplit(URL).hostname and len(responses)<80:
                      responses.append({'method':r.request.method,'path':urlsplit(r.url).path,'status':r.status})
              page.on('response',observe)
              try:
                  response=page.goto(URL,wait_until='domcontentloaded',timeout=30000)
                  if response is None or response.status>=400:
                      raise RuntimeError('home HTTP failure')
                  def ready():
                      page.locator('#loadmsg').wait_for(state='hidden',timeout=30000)

                  def checked_by_label(control):
                      target = page.locator('#'+control)
                      if not target.is_checked():
                          ready()
                          label = page.locator('label[for="'+control+'"]')
                          if label.count() == 1 and label.is_visible():
                              label.click(timeout=10000)
                          else:
                              target.click(timeout=10000)
                          ready()
                      if not target.is_checked():
                          raise RuntimeError('selection not applied: '+control)

                  page.locator('#bname').wait_for(state='visible',timeout=15000)
                  ready()
                  # Use the actual public form and its detailed date options.
                  checked_by_label('thismonth')
                  print('MONTH_SELECTED',flush=True)
                  page.locator('#bname').select_option(value='1100_0',timeout=15000)
                  ready()
                  page.locator('#purpose').select_option(value='31000000_31010300',timeout=15000)
                  ready()
                  print('DISTRICT_AND_PURPOSE_SELECTED',flush=True)
                  if not page.locator('#saturday').is_visible():
                      page.locator('#collapse-when').click(timeout=10000)
                      ready()
                  page.locator('#saturday').wait_for(state='attached',timeout=10000)
                  # Detailed options may change the period mode. Verify the actual
                  # period and weekday controls before any public search submission.
                  if page.locator('#days').is_visible():
                      page.locator('#days').select_option(value='31',timeout=10000)
                      ready()
                  for day in ('monday','tuesday','wednesday','thursday','friday','holiday'):
                      target = page.locator('#'+day)
                      if target.is_checked():
                          label = page.locator('label[for="'+day+'"]')
                          ready()
                          if label.count() == 1 and label.is_visible():
                              label.click(timeout=10000)
                          else:
                              target.click(timeout=10000)
                          ready()
                  for day in ('saturday','sunday'):
                      checked_by_label(day)
                  days = page.locator('#days')
                  period_ok = days.input_value() == '31' if days.is_visible() else page.locator('#thismonth').is_checked()
                  chosen = [day for day in ('monday','tuesday','wednesday','thursday','friday','saturday','sunday','holiday') if page.locator('#'+day).is_checked()]
                  print('SELECTED_CONDITIONS',json.dumps({'period_days':days.input_value(),'month_radio':page.locator('#thismonth').is_checked(),'weekdays':chosen,'district':page.locator('#bname').input_value(),'purpose':page.locator('#purpose').input_value()},ensure_ascii=False),flush=True)
                  if not period_ok or chosen != ['saturday','sunday'] or page.locator('#bname').input_value()!='1100_0' or page.locator('#purpose').input_value()!='31000000_31010300':
                      raise RuntimeError('search selection mismatch')
                  snapshot(page,'before-search')
                  # Only the verified visible public search button is clicked. No login or booking.
                  ready()
                  page.locator('#btn-go').click(timeout=15000)
                  try:
                      page.wait_for_load_state('networkidle',timeout=12000)
                  except Exception:
                      pass
                  ready()
                  page.wait_for_timeout(1000)
                  snapshot(page,'after-search')
                  print('PUBLIC_SEARCH_CLICKED',flush=True)
              except Exception as e:
                  print('PROBE_ERROR',type(e).__name__,flush=True)
                  snapshot(page,'error')
                  raise
              finally:
                  print('SHINAGAWA_HTTP',json.dumps(responses,ensure_ascii=False),flush=True)
                  browser.close()
          PY
      - name: 診断結果を保存（失敗時も実行）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinagawa-public-diagnostics
          path: shinagawa-diagnostics/
          if-no-files-found: warn
          retention-days: 2
