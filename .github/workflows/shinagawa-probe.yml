name: 品川区施設検索・全地区検証 v12
on:
  workflow_dispatch:
    inputs:
      school_district:
        description: 学校カレンダーの診断対象（全地区または個別地区）
        type: choice
        default: 全地区
        options:
          - 全地区
          - 荏原
          - 大井
          - 大崎
          - 品川
          - 八潮
          - スキップ
permissions:
  contents: read
concurrency:
  group: shinagawa-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ブラウザ準備（既存Chrome優先）
        timeout-minutes: 2
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          CHROME=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME="$(command -v "$candidate")"
              break
            fi
          done
          if [ -n "$CHROME" ]; then
            "$CHROME" --version
            echo "SHINAGAWA_CHROME=$CHROME" >> "$GITHUB_ENV"
            echo "Using preinstalled browser"
          else
            echo "No system browser; installing headless shell only"
            python -m playwright install --only-shell chromium
          fi
      - name: 全地区の公開API抽出・学校カレンダー診断（予約なし）
        timeout-minutes: 32
        env:
          SCHOOL_DISTRICT: ${{ inputs.school_district }}
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=5s 1890s python -u - <<'PY'
          import json, os, re, calendar, time
          from pathlib import Path
          from datetime import date, datetime, timedelta, time as clock
          from zoneinfo import ZoneInfo
          from urllib.parse import urlsplit, parse_qs
          from playwright.sync_api import sync_playwright
          
          URL='https://www.cm9.eprs.jp/shinagawa/web/index.jsp'
          DISTRICTS={'荏原':'1100_0','大井':'1200_0','大崎':'1300_0','品川':'1400_0','八潮':'1500_0'}
          PURPOSE='31000000_31010300'
          DAYS=('monday','tuesday','wednesday','thursday','friday','saturday','sunday','holiday')
          TIMES=('allday','morning','afternoon','evening')
          JST=ZoneInfo('Asia/Tokyo'); NOW=datetime.now(JST); TODAY=NOW.date()
          OUT=Path('shinagawa-results'); OUT.mkdir(exist_ok=True)
          
          def shift(d,n):
              y,m=divmod(d.year*12+d.month-1+n,12)
              return date(y,m+1,min(d.day,calendar.monthrange(y,m+1)[1]))
          
          def classify(building, room, d):
              if re.search(r'小学校|中学校|学園',building):
                  if d > shift(TODAY.replace(day=1),2)-timedelta(days=1): return None
                  opening=datetime.combine(shift(d.replace(day=20),-1),clock(9),JST)
                  end=d-timedelta(days=7)
                  label='学校'
              elif building in ('総合体育館','戸越体育館','スクエア荏原') and (building!='スクエア荏原' or 'アリーナ' in room):
                  opening_day=shift(d,-2)
                  return {'種別':'区立体育館','予約状態':'受付開始日目安・時刻と資格要確認','受付開始':opening_day.isoformat()}
              else:
                  return {'種別':'その他','予約状態':'個別確認','受付開始':None}
              # Public vacancy is not proof of account-specific eligibility.
              status='受付開始前' if NOW<opening else 'オンライン期限後・要確認' if TODAY>end else '受付期間内（資格要確認）'
              return {'種別':label,'予約状態':status,'受付開始':opening.isoformat()}
          
          def parse_date(value):
              # Accept only unambiguous Gregorian date fields, not display text.
              s=str(value).strip()
              for fmt in ('%Y%m%d','%Y-%m-%d','%Y/%m/%d'):
                  try: return datetime.strptime(s,fmt).date()
                  except ValueError: pass
              raise ValueError('unknown useYmd format: '+s[:30])
          
          def minutes(value):
              s=str(value).strip()
              if re.fullmatch(r'\d{3,4}',s): h,m=divmod(int(s),100)
              elif re.fullmatch(r'\d{1,2}:\d{2}(?::00)?',s): h,m=map(int,s.split(':')[:2])
              elif re.fullmatch(r'\d{1,2}時\d{2}分',s): h,m=map(int,re.findall(r'\d+',s))
              else: raise ValueError('unknown time format: '+s[:30])
              if not (0<=m<60 and (0<=h<24 or h==24 and m==0)): raise ValueError('invalid time')
              return h*60+m
          
          def public_row(row):
              keys=('bcd','icd','bcdNm','icdNm','useYmd','sTime','eTime','sJTime','eJTime','sJTime2','eJTime2','sTimeZones','eTimeZones','timeZoneNos','tZoneNo')
              return {k:row.get(k) for k in keys if k in row}
          
          def row_key(row):
              return json.dumps([row.get(k) for k in ('bcd','icd','useYmd','sTime','eTime','timeZoneNos','tZoneNo')],ensure_ascii=False,sort_keys=True)
          
          def parse_api(rows,district,start,end,diagnostic=False):
              slots=[]; errors=[]
              for row in rows:
                  try:
                      b=str(row.get('bcdNm') or '').strip(); r=str(row.get('icdNm') or '').strip()
                      if not b or not r: raise ValueError('missing facility name')
                      d=parse_date(row.get('useYmd'))
                      if not start<=d<=end or (not diagnostic and d.weekday()<5): raise ValueError('date outside query')
                      a,z=minutes(row.get('sTime')),minutes(row.get('eTime'))
                      if a>=z: raise ValueError('start >= end')
                      # If structured subslots are provided, do not assume that gaps are bookable.
                      # Inspect their shape; flag multi-segment rows for review instead of guessing.
                      st,et=row.get('sTimeZones'),row.get('eTimeZones')
                      if isinstance(st,str) and st: st=st.split('|')
                      if isinstance(et,str) and et: et=et.split('|')
                      if bool(st)!=bool(et): raise ValueError('incomplete subslot data')
                      if isinstance(st,list) and isinstance(et,list) and st and et:
                          if len(st)!=len(et): raise ValueError('subslot count mismatch')
                          ranges=[(minutes(x),minutes(y)) for x,y in zip(st,et)]
                          if any(x>=y or x<a or y>z for x,y in ranges): raise ValueError('subslot range mismatch')
                          if ranges!=sorted(ranges) or any(ranges[i][1]>ranges[i+1][0] for i in range(len(ranges)-1)): raise ValueError('overlapping or unordered subslots')
                      else: ranges=[(a,z)]
                      kind=classify(b,r,d) if not diagnostic else {'種別':'診断','予約状態':'通知対象外','受付開始':None}
                      if kind is None: continue
                      for x,y in ranges:
                          slots.append({'地区':district,'館':b,'施設':r,'日付':d.isoformat(),'開始':f'{x//60:02}:{x%60:02}','終了':f'{y//60:02}:{y%60:02}','分':y-x,**kind})
                  except Exception as e: errors.append({'error':str(e)[:200],'row':public_row(row)})
              return slots,errors
          
          def payload_shape(payload):
              if not isinstance(payload,dict) or not isinstance(payload.get('results'),list): raise ValueError('unknown response shape')
              total=int(payload['all']); hit=int(payload['hitcnt']); nxt=int(payload['next'])
              if total<0 or hit!=len(payload['results']) or hit>total or nxt<0: raise ValueError('inconsistent result counters')
              if any(not isinstance(x,dict) for x in payload['results']): raise ValueError('invalid result item')
              return total,hit,nxt
          
          def replace_offset(raw,offset):
              if len(re.findall(rb'(?:^|&)offset=[^&]*',raw))!=1: raise RuntimeError('offset missing or ambiguous')
              return re.sub(rb'(^|&)offset=[^&]*',lambda m:m.group(1)+b'offset='+str(offset).encode('ascii'),raw)
          
          def decode_payload(raw,content_type=''):
              # Decode strictly; an HTML error page must never count as zero vacancies.
              declared=re.search(r'charset\s*=\s*["\']?([a-zA-Z0-9_-]+)',content_type,re.I)
              encodings=['utf-8-sig']+([declared.group(1)] if declared else [])+['cp932','shift_jis','euc_jp']
              for encoding in dict.fromkeys(encodings):
                  try:
                      payload=json.loads(raw.decode(encoding))
                      payload_shape(payload)
                      return payload,encoding
                  except (UnicodeError,LookupError,ValueError,KeyError,TypeError): pass
              raise RuntimeError('pagination response is not valid JSON with known counters; content-type='+content_type[:100])
          
          def request_params(req):
              # ASCII form keys and values are all that are logged. Preserve non-ASCII bytes internally.
              return parse_qs((req.post_data_buffer or b'').decode('latin-1'),keep_blank_values=True,encoding='latin-1')
          
          def collect_pages(page,first):
              req=first.request; url=req.url
              if urlsplit(url).hostname!=urlsplit(URL).hostname or not urlsplit(url).path.endswith('/rsvWOpeUnreservedSearchAjaxAction.do') or req.method!='POST': raise RuntimeError('unexpected public search endpoint')
              raw=req.post_data_buffer or b''
              if not raw: raise RuntimeError('missing original request body')
              if len(re.findall(rb'(?:^|&)offset=[^&]*',raw))!=1: raise RuntimeError('offset missing or ambiguous')
              headers={k:v for k,v in req.headers.items() if k.lower() in ('content-type','x-requested-with','accept','origin','referer')}
              payload,encoding=decode_payload(first.body(),first.headers.get('content-type','')); total,hit,nxt=payload_shape(payload)
              if not re.search(rb'(?:^|&)offset=0(?:&|$)',raw): raise RuntimeError('unexpected initial offset')
              print('API_FIRST',json.dumps({'all':total,'hitcnt':hit,'next':nxt,'sample':[public_row(r) for r in payload['results'][:2]]},ensure_ascii=False),flush=True)
              rows=list(payload['results']); keys={row_key(r) for r in rows}
              pages=[{'offset':0,'all':total,'hitcnt':hit,'next':nxt,'encoding':encoding}]
              seen_offsets={0}
              if len(keys)!=len(rows): raise RuntimeError('duplicate rows in first response')
              # Follow the server-provided next cursor using the same public read-only POST.
              # Reuse the browser context cookies internally, never log or persist them.
              while len(rows)<total:
                  if len(pages)>=30 or nxt<=0 or nxt in seen_offsets: raise RuntimeError('pagination cursor invalid or safety limit reached')
                  offset=nxt; seen_offsets.add(offset)
                  body=replace_offset(raw,offset)
                  time.sleep(0.7)
                  response=page.context.request.post(url,data=body,headers=headers,timeout=20000,max_redirects=0)
                  try:
                      if response.status!=200: raise RuntimeError('pagination HTTP '+str(response.status))
                      payload,encoding=decode_payload(response.body(),response.headers.get('content-type','')); t,h,nxt=payload_shape(payload)
                      if t!=total or not h: raise RuntimeError('pagination count changed or empty page')
                      new=payload['results']; new_keys={row_key(r) for r in new}
                      if len(new_keys)!=len(new) or keys & new_keys: raise RuntimeError('pagination duplicates; cursor semantics require verification')
                      rows.extend(new); keys.update(new_keys)
                      pages.append({'offset':offset,'all':t,'hitcnt':h,'next':nxt,'encoding':encoding})
                      print('API_PAGE',json.dumps(pages[-1]),flush=True)
                  finally: response.dispose()
              if len(rows)!=total: raise RuntimeError('total row count mismatch')
              return rows,pages
          
          GRID=r'''() => {
           const t=document.querySelector('#week-info');
           const clean=s=>(s||'').replace(/\s+/g,' ').trim();
           return {building:clean(document.querySelector('#mansion-select')?.selectedOptions[0]?.textContent),room:clean(document.querySelector('#facility-select')?.selectedOptions[0]?.textContent),rooms:[...document.querySelectorAll('#facility-select option')].map(o=>clean(o.textContent)),rows:t?[...t.rows].map(r=>[...r.cells].map(c=>({text:clean(c.innerText),icons:[...c.querySelectorAll('img')].map(i=>({alt:i.alt,title:i.title,file:new URL(i.src,location.href).pathname.split('/').pop()}))}))):[]};
          }'''
          
          def school_calendar(page,start,ready,school_name):
              last=shift(start.replace(day=1),1)-timedelta(days=1)
              expected={start+timedelta(days=i) for i in range((last-start).days+1) if (start+timedelta(days=i)).weekday()>=5}
              dates={}; snapshots=[]
              for _ in range(6):
                  grid=page.evaluate(GRID); snapshots.append(grid)
                  if grid['building']!=school_name or '土日祝' not in grid['room'] or len(grid['rows'])<2: raise RuntimeError('school calendar not verified')
                  weekend_rooms=[r for r in grid['rooms'] if '土日祝' in r]
                  if len(weekend_rooms)!=1: raise RuntimeError('multiple or missing weekend rooms: '+str(grid['rooms']))
                  cols=grid['rows'][0][1:]
                  for i,c in enumerate(cols,1):
                      m=re.search(r'(\d+)月(\d+)日',c['text'])
                      if not m: raise RuntimeError('unknown date header')
                      month,day=map(int,m.groups()); year=start.year+(month<start.month)
                      d=date(year,month,day)
                      if d not in expected: continue
                      if any(len(r)<=i for r in grid['rows'][1:]): raise RuntimeError('school calendar column missing')
                      dates[d]={r[0]['text']:r[i]['icons'] for r in grid['rows'][1:]}
                  if expected<=set(dates): break
                  button=page.locator('#next-week')
                  if not button.is_visible() or not button.is_enabled(): break
                  before=grid['rows'][0]
                  button.click(); ready()
                  try:
                      page.wait_for_function('(before) => JSON.stringify([...document.querySelectorAll("#week-info tr:first-child th, #week-info tr:first-child td")].map(c=>c.innerText.trim().replace(/\\s+/g," "))) !== JSON.stringify(before)',arg=[c['text'] for c in before],timeout=10000)
                  except Exception: pass
                  page.wait_for_timeout(800)
                  if page.evaluate(GRID)['rows'][:1]==grid['rows'][:1]: break
              missing=sorted(str(d) for d in expected-set(dates))
              return {'館':school_name,'対象月':start.strftime('%Y-%m'),'取得日数':len(dates),'予定日数':len(expected),'未取得日':missing,'日別状態':{str(d):v for d,v in sorted(dates.items())},'画面':snapshots}
          
          def scan(browser,district,code,start,control=False,diagnostic=False,time_mode="parts",calendar_only=False,school_name=None):
              end=start+timedelta(days=30)
              page=browser.new_page(locale='ja-JP',timezone_id='Asia/Tokyo',viewport={'width':1440,'height':1000})
              page.set_default_timeout(10000)
              calls=[]; responses=[]; requests=[]; grid=None
              def observe_request(req):
                  path=urlsplit(req.url).path
                  if not path.endswith(('rsvWOpeInstSrchVacantAction.do','rsvWOpeUnreservedDailyAction.do','rsvWOpeUnreservedSearchAjaxAction.do')): return
                  q=request_params(req)
                  # Only public search parameters; no cookies, session IDs or credentials.
                  safe=('date','daystart','days','dayofweek','dayofweekClearFlg','timezone','timezoneClearFlg','selectAreaBcd','selectIcd','selectPpsClPpscd','offset','limit')
                  requests.append({'path':path.rsplit('/',1)[-1],'条件':{k:q[k] for k in safe if k in q}})
              page.on('request',observe_request)
              def observe(r):
                  if 'rsvWOpeUnreservedSearchAjaxAction.do' in urlsplit(r.url).path:
                      q=request_params(r.request)
                      calls.append({'status':r.status,'offset':q.get('offset',[]),'limit':q.get('limit',[])})
                      responses.append(r)
              page.on('response',observe)
              try:
                  res=page.goto(URL,wait_until='domcontentloaded',timeout=20000)
                  if not res or res.status!=200: raise RuntimeError('home HTTP failure')
                  def ready(): page.locator('#loadmsg').wait_for(state='hidden',timeout=12000)
                  def checked(name):
                      target=page.locator('#'+name)
                      if not target.is_checked():
                          ready(); page.locator('label[for="'+name+'"]').click(); ready()
                      if not target.is_checked(): raise RuntimeError('checkbox not selected: '+name)
                  page.locator('#bname').wait_for(state='visible'); ready(); checked('thismonth')
                  page.locator('#bname').select_option(value=code); ready()
                  page.locator('#purpose').select_option(value=PURPOSE); ready()
                  if not page.locator('#saturday').is_visible(): page.locator('#collapse-when').click(); ready()
                  if page.locator('#days').is_visible(): page.locator('#days').select_option('31'); ready()
                  if start!=TODAY:
                      day=page.locator('#daystart')
                      if not day.is_visible(): raise RuntimeError('custom start unavailable')
                      day.fill(start.isoformat()); day.press('Tab'); ready()
                  target_days=list(DAYS) if diagnostic else ['saturday','sunday']
                  for name in DAYS:
                      target=page.locator('#'+name)
                      if target.is_checked() != (name in target_days):
                          ready(); page.locator('label[for="'+name+'"]').click(); ready()
                  # v8 sent no timezone values to the daily endpoint. Explicitly
                  # select every published time category, including full-day slots.
                  expected_times = ['allday'] if time_mode=='allday' else ['morning','afternoon','evening']
                  for name in expected_times:
                      checked(name)
                  for name in TIMES:
                      if name not in expected_times and page.locator('#'+name).is_checked():
                          ready(); page.locator('label[for="'+name+'"]').click(); ready()
                  time_controls={name:page.locator('#'+name).input_value() for name in TIMES}
                  time_selected=[name for name in TIMES if page.locator('#'+name).is_checked()]
                  print('TIME_SELECTION',json.dumps({'地区':district,'開始日':start.isoformat(),'選択':time_selected,'値':time_controls,'診断':diagnostic,'時間帯方式':time_mode},ensure_ascii=False),flush=True)
                  if set(time_selected)!=set(expected_times): raise RuntimeError('time mode mismatch: '+time_mode)
                  actual=page.locator('#daystart').input_value()
                  chosen=[n for n in DAYS if page.locator('#'+n).is_checked()]
                  if (actual!=start.isoformat() or page.locator('#days').input_value()!='31' or chosen!=target_days or page.locator('#bname').input_value()!=code or page.locator('#purpose').input_value()!=PURPOSE):
                      raise RuntimeError('condition mismatch: '+str({'date':actual,'days':page.locator('#days').input_value(),'weekdays':chosen}))
                  print('SEARCH',district,start,flush=True)
                  # Match the successful v6 sequence: wait for initial facility AJAX,
                  # not just disappearance of the overlay, before switching views.
                  with page.expect_response(lambda r: urlsplit(r.url).path.endswith('/rsvWOpeInstSrchVacantAjaxAction.do'),timeout=25000) as first:
                      page.locator('#btn-go').click()
                  if first.value.status!=200: raise RuntimeError('facility search HTTP failure')
                  first.value.body()
                  try: page.wait_for_load_state('networkidle',timeout=8000)
                  except Exception: pass
                  ready(); page.wait_for_timeout(1000)
                  if calendar_only:
                      report=school_calendar(page,start,ready,school_name or '清水台小学校')
                      (OUT/f'school-{code}-{start}.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
                      print('SCHOOL_INDEPENDENT',json.dumps({k:v for k,v in report.items() if k not in ('画面','日別状態')},ensure_ascii=False),flush=True)
                      return report
                  tab=page.get_by_role('link',name='日付順',exact=True); tab.wait_for(state='visible')
                  with page.expect_response(lambda r:'rsvWOpeUnreservedSearchAjaxAction.do' in urlsplit(r.url).path,timeout=25000) as wait:
                      tab.click()
                  if wait.value.status!=200: raise RuntimeError('date-order HTTP failure')
                  wait.value.body()
                  try: page.wait_for_load_state('networkidle',timeout=8000)
                  except Exception: pass
                  ready(); page.wait_for_timeout(1200)
                  rows,pages=collect_pages(page,wait.value)
                  slots,errors=parse_api(rows,district,start,end,diagnostic)
                  body=page.locator('body').inner_text()
                  expected=f'{start.year}年{start.month}月{start.day}日'
                  target_label='清水台小学校' if control else district+'地区'
                  daily=[r['条件'] for r in requests if r['path']=='rsvWOpeUnreservedSearchAjaxAction.do']
                  wanted_days={str(i+1) for i,n in enumerate(DAYS[:7]) if n in target_days} | ({'9'} if 'holiday' in target_days else set())
                  expected_values={time_controls[n] for n in expected_times}
                  if not daily or any(set(q.get('timezone',[]))!=expected_values or set(q.get('dayofweek',[]))!=wanted_days or q.get('daystart')!=[start.isoformat()] or q.get('days')!=['31'] or q.get('selectAreaBcd')!=[code] or q.get('selectPpsClPpscd')!=[PURPOSE] for q in daily):
                      errors.append('request condition mismatch')
                  if expected not in body or (not diagnostic and '土日曜' not in body) or '1か月表示' not in body or target_label not in body or 'バレーボール' not in body:
                      errors.append('server search condition echo not verified')
                  empty_text='指定条件に該当する空き施設が見つかりませんでした' in body
                  if (not rows)!=empty_text: errors.append('API / page empty indication mismatch')
                  report={'地区':district,'開始日':start.isoformat(),'終了日':end.isoformat(),'空き枠':slots,'注意':errors,'通信':calls,'送信条件':requests,'ページ':pages,'API件数':len(rows),'API抜粋':[public_row(r) for r in rows[:3]],'網羅性':'要検証' if errors else 'API件数一致','対照検索':control,'陽性診断':diagnostic,'時間帯方式':time_mode}
                  (OUT/f'{code}-{start}-{time_mode}{"-positive" if diagnostic else ""}.json').write_text(json.dumps({**report,'API全公開項目':[public_row(r) for r in rows]},ensure_ascii=False,indent=2),encoding='utf-8')
                  print('DISTRICT_RESULT',json.dumps(report,ensure_ascii=False),flush=True)
                  return report
              finally:
                  page.remove_listener('request',observe_request)
                  page.remove_listener('response',observe)
                  page.close()
          
          def discover_schools(browser):
              page=browser.new_page(locale='ja-JP',timezone_id='Asia/Tokyo')
              try:
                  response=page.goto(URL,wait_until='domcontentloaded',timeout=20000)
                  if not response or response.status!=200: raise RuntimeError('school directory HTTP failure')
                  page.locator('#bname').wait_for(state='visible',timeout=15000)
                  page.locator('#loadmsg').wait_for(state='hidden',timeout=12000)
                  options=page.locator('#bname option').evaluate_all("opts => opts.map(o=>({name:o.textContent.trim(),code:o.value}))")
                  district_by_prefix={v.split('_')[0]:k for k,v in DISTRICTS.items()}
                  schools=[dict(o,district=district_by_prefix[o['code'].split('_')[0]]) for o in options if re.search(r'小学校|中学校|学園',o['name']) and re.fullmatch(r'\d{4}_\d{4}',o['code']) and o['code'].split('_')[0] in district_by_prefix]
                  if len({s['code'] for s in schools})!=len(schools) or set(s['district'] for s in schools)!=set(DISTRICTS): raise RuntimeError('school directory incomplete or duplicate')
                  print('SCHOOL_DIRECTORY',json.dumps(schools,ensure_ascii=False),flush=True)
                  return schools
              finally: page.close()
          
          def scan_schools(browser):
              scope=os.environ.get('SCHOOL_DISTRICT','全地区') or '全地区'
              if scope=='スキップ': return {'対象':scope,'予定校数':0,'取得校数':0,'失敗校':[],'未判定枠':0,'実施':False}
              if scope!='全地区' and scope not in DISTRICTS: raise RuntimeError('invalid school scope')
              schools=[s for s in discover_schools(browser) if scope=='全地区' or s['district']==scope]
              month=shift(TODAY.replace(day=1),1)
              results=[]; failures=[]; unknown=[]; states={}
              for school in schools:
                  try:
                      r=scan(browser,school['district'],school['code'],month,control=True,calendar_only=True,school_name=school['name'])
                      if not r['日別状態'] or r['未取得日']: raise RuntimeError('calendar dates missing: '+str(r['未取得日']))
                      for d,day in r['日別状態'].items():
                          for period,icons in day.items():
                              labels=[i['alt'] for i in icons]
                              for label in labels: states[label]=states.get(label,0)+1
                              if not labels or any(label not in ('保守日','予約あり','受付期間外') for label in labels):
                                  unknown.append({'地区':school['district'],'館':school['name'],'日付':d,'時間帯':period,'表示':labels})
                      results.append({'地区':school['district'],'館':school['name'],'code':school['code'],'取得日数':r['取得日数']})
                  except Exception as e:
                      failures.append({'地区':school['district'],'館':school['name'],'code':school['code'],'エラー':str(e)[:300]})
                      print('SCHOOL_ERROR',json.dumps(failures[-1],ensure_ascii=False),flush=True)
                  finally:
                      (OUT/'school-progress.json').write_text(json.dumps({'取得':results,'失敗':failures,'予定':len(schools)},ensure_ascii=False,indent=2),encoding='utf-8')
                  time.sleep(1)
              (OUT/'school-unclassified.json').write_text(json.dumps(unknown,ensure_ascii=False,indent=2),encoding='utf-8')
              return {'対象':scope,'対象月':month.strftime('%Y-%m'),'予定校数':len(schools),'取得校数':len(results),'失敗校':failures,'状態別件数':states,'未判定枠':len(unknown),'実施':True,'注意':'空き・受付開始前の表示は未確定。未判定枠を空きと断定しない。'}
          
          # 31-day chunks: cover both the next calendar month and the two-month horizon.
          horizon=max(shift(TODAY,2),shift(TODAY.replace(day=1),2)-timedelta(days=1))
          starts=[]; d=TODAY
          while d<=horizon: starts.append(d); d+=timedelta(days=31)
          reports=[]
          with sync_playwright() as p:
              chrome=os.environ.get('SHINAGAWA_CHROME')
              browser=p.chromium.launch(**({'executable_path':chrome} if chrome else {}),timeout=15000)
              try:
                  positive={'実施':True}
                  try:
                      pr=scan(browser,'荏原','1100_0',TODAY,diagnostic=True)
                      positive={'実施':True,'取得枠数':len(pr['空き枠']),'API件数':pr['API件数'],'ページ':pr['ページ'],'注意':pr['注意']}
                  except Exception as e: positive={'実施':True,'エラー':str(e)[:400]}
                  print('POSITIVE_CONTROL',json.dumps(positive,ensure_ascii=False),flush=True)
                  for start in starts:
                      for district,code in DISTRICTS.items():
                          try: reports.append(scan(browser,district,code,start))
                          except Exception as e:
                              report={'地区':district,'開始日':start.isoformat(),'エラー':str(e)[:400],'空き枠':[]}
                              reports.append(report); print('DISTRICT_ERROR',json.dumps(report,ensure_ascii=False),flush=True)
                          finally: (OUT/'progress.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2),encoding='utf-8')
                          time.sleep(1)
                  # Compare the site's mutually exclusive time modes on the same district/date.
                  mode_comparison={'実施':False}
                  try:
                      alt=scan(browser,'荏原','1100_0',TODAY,time_mode='allday')
                      base=next((r for r in reports if r['地区']=='荏原' and r['開始日']==TODAY.isoformat()),{})
                      def slotkey(s): return tuple(s[k] for k in ('館','施設','日付','開始','終了'))
                      a={slotkey(s) for s in base.get('空き枠',[])}; b={slotkey(s) for s in alt.get('空き枠',[])}
                      mode_comparison={'実施':True,'午前午後夜間':len(a),'終日':len(b),'一致':a==b and not base.get('注意') and not base.get('エラー') and not alt.get('注意'),'午前午後夜間のみ':sorted(a-b),'終日のみ':sorted(b-a),'注意':alt.get('注意',[])}
                  except Exception as e: mode_comparison={'実施':True,'エラー':str(e)[:400]}
                  print('TIME_MODE_COMPARISON',json.dumps(mode_comparison,ensure_ascii=False),flush=True)
                  # Independently compare one facility-specific public search against
                  # its district's aggregate. This is a control, not a reservation.
                  control_report=None
                  try:
                      control_report=scan(browser,'荏原','1100_3300',TODAY,control=True)
                      area=next((r for r in reports if r['地区']=='荏原' and r['開始日']==TODAY.isoformat()),None)
                      def key(s): return tuple(s[k] for k in ('館','施設','日付','開始','終了'))
                      area_keys={key(s) for s in (area or {}).get('空き枠',[]) if s['館']=='清水台小学校'}
                      control_keys={key(s) for s in control_report.get('空き枠',[])}
                      match=bool(area) and not area.get('エラー') and not area.get('注意') and not control_report.get('注意') and area_keys==control_keys
                      comparison={'一致':match,'地区検索枠':len(area_keys),'施設単独検索枠':len(control_keys),'注意':'両方0件の場合は抽出の陽性検証にはならない'}
                  except Exception as e:
                      comparison={'一致':False,'エラー':str(e)[:400]}
                  print('CONTROL_COMPARISON',json.dumps(comparison,ensure_ascii=False),flush=True)
                  (OUT/'control-comparison.json').write_text(json.dumps(comparison,ensure_ascii=False,indent=2),encoding='utf-8')
                  try: school_probe=scan_schools(browser)
                  except Exception as e: school_probe={'エラー':str(e)[:400],'実施':True}
                  print('SCHOOL_ALL_RESULT',json.dumps(school_probe,ensure_ascii=False),flush=True)
                  (OUT/'school-calendar-summary.json').write_text(json.dumps(school_probe,ensure_ascii=False,indent=2),encoding='utf-8')
              finally: browser.close()
          slots={}
          for r in reports:
              for s in r['空き枠']:
                  if TODAY<=date.fromisoformat(s['日付'])<=horizon:
                      slots[tuple(s[k] for k in ('館','施設','日付','開始','終了'))]=s
          result={'検索日':TODAY.isoformat(),'対象終了日':horizon.isoformat(),'検索予定':len(starts)*len(DISTRICTS),'検索結果':reports,'対照結果':comparison,'陽性診断':positive,'時間帯比較':mode_comparison,'学校独立診断':school_probe,'取得枠':sorted(slots.values(),key=lambda s:(s['日付'],s['開始'],s['館'])),'網羅性':'検証中（空きなしの断定禁止）'}
          # Separate business rules and outputs without doubling district traffic.
          result['学校枠']=[s for s in result['取得枠'] if s['種別']=='学校']
          result['学校以外枠']=[s for s in result['取得枠'] if s['種別']!='学校']
          result['学校受付開始前']=[s for s in result['学校枠'] if s['予約状態']=='受付開始前']
          result['学校事前候補の網羅性']='対象校のカレンダー取得結果を参照。受付開始前の空き判定は未検証'
          (OUT/'schools.json').write_text(json.dumps(result['学校枠'],ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'other-facilities.json').write_text(json.dumps(result['学校以外枠'],ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_RESULT',json.dumps({k:v for k,v in result.items() if k!='検索結果'},ensure_ascii=False),flush=True)
          lines=[f"## 品川区 空き検索（検証版）",f"取得 {len(slots)} 件 / 検索 {len(reports)} 回（網羅性検証中）",f"学校 {len(result['学校枠'])} 件 / 学校以外 {len(result['学校以外枠'])} 件",'|日付|地区|施設|時間|受付状態|','|---|---|---|---|---|']
          for s in result['取得枠']: lines.append(f"|{s['日付']}|{s['地区']}|{s['館']} {s['施設']}|{s['開始']}–{s['終了']}|{s['予約状態']}|")
          for r in reports:
              if r.get('エラー') or r.get('注意'): lines.append(f"- 要確認: {r['地区']} {r['開始日']} {r.get('エラー',r.get('注意'))}")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f: f.write('\n'.join(lines)+'\n')
          if not comparison.get('一致') or not mode_comparison.get('一致') or school_probe.get('エラー') or school_probe.get('失敗校') or (school_probe.get('実施') and school_probe.get('取得校数')!=school_probe.get('予定校数')) or positive.get('エラー') or positive.get('注意') or not positive.get('API件数') or any(r.get('エラー') or r.get('注意') for r in reports): raise SystemExit('Partial or ambiguous results: inspect report')
          PY
      - name: 検証結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinagawa-public-results
          path: shinagawa-results/
          if-no-files-found: warn
          retention-days: 2
